services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://laboratorio:laboratorio@mysql:3306/laboratorio
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: laboratorio
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: laboratorio
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5